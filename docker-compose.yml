services:
  sendhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: sendhub:latest
    container_name: sendhub
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SendHub__Database__Path: /data/db/sendhub.db
      DOTNET_ENVIRONMENT: Production

    volumes:
      # Bind mount: point at your existing scan folder on the host
      - ${SCAN_FOLDER_HOST_PATH:-./data/scan}:/data/scan
      # Named volume: SQLite database, survives container recreation
      - sendhub-db:/data/db

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sendhub-db:
    driver: local
